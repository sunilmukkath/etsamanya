<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment received — samanya</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/styles.css?v=34" />
</head>
<body>
  <main class="wrap shop-page">
    <p class="kicker">Received</p>
    <h1 class="display">Thank you. PayU has the till.</h1>
    <p class="lede" id="okCopy">We will pack from this week’s lots and write when it leaves.</p>
    <p id="okLinks"><a class="btn btn-primary" href="account.html">Your orders</a> <a class="btn btn-ghost" href="index.html">Back home</a></p>
  </main>
  <script src="js/shop.js?v=3"></script>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var txn = params.get("txnid");
      try { localStorage.removeItem("samanya-cart"); } catch (err) {}
      if (!txn) return;
      fetch("/api/orders/receipt?txnid=" + encodeURIComponent(txn)).then(function (res) { return res.json(); }).then(function (data) {
        var copy = document.getElementById("okCopy");
        copy.textContent = "Order " + (data.txnid || txn) + (data.invoiceNo ? " · " + data.invoiceNo : "") + ". We will pack from this week’s lots and write when it leaves.";
        if (data.invoiceToken) {
          var links = document.getElementById("okLinks");
          var a = document.createElement("a");
          a.className = "btn btn-ghost";
          a.href = "/api/invoice?id=" + encodeURIComponent(data.txnid) + "&t=" + encodeURIComponent(data.invoiceToken);
          a.textContent = "Invoice";
          links.appendChild(a);
        }
      }).catch(function () {
        document.getElementById("okCopy").textContent = "Reference " + txn + ". We will pack from this week’s lots and write when it leaves.";
      });
      try { localStorage.removeItem("samanya-pending-order"); } catch (err) {}
    })();
  </script>
</body>
</html>
